version: '3.8'

services:
  backend:
    build: ./backend_api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - DATABASE_NAME=${DATABASE_NAME}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./backend_api:/app
      - ./uploads:/app/uploads
      - ./trained_models:/app/trained_models
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_data:/data/db

  frontend:
    build: ./frontend_flutter
    ports:
      - "8080:8080"
    depends_on:
      - backend
    command: flutter run -d web-server --web-port 8080 --web-hostname 0.0.0.0

volumes:
  mongodb_data:
